<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="libs/bulma.min.css" />
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/custom.css" />
  <link rel="stylesheet" href="css/custom-themes.css" />
  <script>
    (function() {
      var mode = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var palette = localStorage.getItem('palette') || 'default';
      if (palette !== 'default') document.documentElement.setAttribute('data-palette', palette);
    })();
  </script>
</head>
<body>
  <div id="site-navbar"></div>

  <!-- 动态天空横幅 -->
  <section class="hero is-light hero-sky" style="margin-top: 3.25rem;">
    <div id="sky-celestial"></div>
    <div id="sky-moon"></div>
    <div id="sky-stars"></div>
    
    <div class="time-control">
      <div class="time-info">
        <span id="time-display" class="time-text">12:00:00</span>
        <span class="time-divider">·</span>
        <span id="date-display" class="date-text">1月1日 周一</span>
      </div>
      <button id="time-btn" class="time-btn" title="切换时段效果">
        <span id="time-icon">☀️ 白天</span>
      </button>
    </div>

    <div class="hero-body py-5" style="position: relative; z-index: 2;">
      <div class="container has-text-centered">
        <h1 id="page-title" class="title is-2 mb-3" style="color: inherit;"></h1>
        <p id="page-subtitle" class="subtitle is-5" style="color: inherit; opacity: 0.8;"></p>
      </div>
    </div>
  </section>

  <section class="section pt-5" style="position: relative;">

    <div class="container">
      <div class="columns is-variable is-8">
        <!-- 左侧：友链列表 -->
        <div class="column is-8">
          <h2 class="title is-4 mb-4"><i class="fas fa-link has-text-primary mr-2"></i><span id="neighbors-title-text"></span></h2>
          <div id="link-list" class="columns is-multiline"></div>
        </div>

        <!-- 右侧：我的社交阵地 -->
        <div class="column is-4">
          <div class="box mb-5" style="border-radius: var(--bulma-radius-large);">
            <h3 class="title is-5 mb-4"><i class="fas fa-satellite-dish has-text-primary mr-2"></i><span id="my-sites-title-text"></span></h3>
            <div id="social-list" class="menu-list"></div>
          </div>
          
          <div class="notification is-info is-light" style="border-radius: var(--bulma-radius-large);">
            <p id="exchange-note" class="is-size-7"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/fallback-data.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/cursor.js" defer></script>
  <script src="js/links.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/sky.js" defer></script>
  <script src="js/theme.js" defer></script>
</body>
</html>
