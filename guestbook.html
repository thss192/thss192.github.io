<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>留言板 · 我的博客</title>
  <link rel="stylesheet" href="libs/bulma.min.css" />
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/custom.css" />
  <link rel="stylesheet" href="css/custom-themes.css" />
  <link rel="stylesheet" href="css/guestbook.css" />
  <link rel="stylesheet" href="css/sky.css" />
  <script>
    (function() {
      var mode = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var palette = localStorage.getItem('palette') || 'default';
      if (palette !== 'default') document.documentElement.setAttribute('data-palette', palette);
    })();
  </script>
</head>
<body>
  <div id="site-navbar"></div>

  <!-- 动态天空横幅 -->
  <section class="hero is-light hero-sky" style="margin-top: 3.25rem;">
    <div id="sky-celestial"></div>
    <div id="sky-moon"></div>
    <div id="sky-stars"></div>
    
    <div class="time-control">
      <div class="time-info">
        <span id="time-display" class="time-text">12:00:00</span>
        <span class="time-divider">·</span>
        <span id="date-display" class="date-text">1月1日 周一</span>
      </div>
      <button id="time-btn" class="time-btn" title="切换时段效果">
        <span id="time-icon">☀️ 白天</span>
      </button>
    </div>

    <div class="hero-body py-5" style="position: relative; z-index: 2;">
      <div class="container">
        <h1 class="title is-2 mb-3" style="color: inherit;">
          <span class="icon has-text-primary mr-2" style="color: inherit;"><i class="fas fa-comments"></i></span>
          <span id="posts-title-text"></span>
        </h1>
        <p id="page-subtitle" class="subtitle is-5" style="color: inherit; opacity: 0.8;"></p>
      </div>
    </div>
  </section>

  <section class="section pt-5" style="position: relative;">
    <div class="container" style="max-width: 860px;">
      
      <!-- 留言板毛玻璃容器 -->
      <div class="guestbook-container">
        <div id="giscus-mount"></div>
      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <!-- 引入公共 JS -->
  <script src="js/fallback-data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cursor.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/sky.js" defer></script>
  <script src="js/theme.js" defer></script>

  <!-- 核心逻辑：执行布局渲染 + 动态加载 Giscus + 完美主题同步 -->
  <script>
    document.addEventListener("DOMContentLoaded", async function() {
      // 1. 初始化公共布局（导航栏、页脚、搜索框）
      const config = await initLayout("guestbook.html");
      
      // 2. 读取 config.json 中的 guestbookPage 配置，渲染标题和副标题
      const gp = ((config && config.pageCopy) || {}).guestbookPage || {};
      const titleEl = document.getElementById("posts-title-text");
      const subtitleEl = document.getElementById("page-subtitle");
      if (titleEl) titleEl.textContent = gp.title || "留言板";
      if (subtitleEl) subtitleEl.textContent = gp.subtitle || "留下你的足迹，随便聊聊。";

      // 3. 动态注入 Giscus 脚本
      const giscusScript = document.createElement("script");
      giscusScript.src = "https://giscus.app/client.js";
      giscusScript.setAttribute("data-repo", "thss192/thss192.github.io");
      giscusScript.setAttribute("data-repo-id", "R_kgDOVW1aCw");
      
      // 使用允许陌生人发帖的 Comments 分类
      giscusScript.setAttribute("data-category", "Comments");
      giscusScript.setAttribute("data-category-id", "DIC_kwDOVW1aC84DKdgr"); 
      
      // 使用特定字符串，并固定为 guestbook，保证所有人的评论都在同一个帖子里
      giscusScript.setAttribute("data-mapping", "specific");
      giscusScript.setAttribute("data-term", "guestbook");
      
      giscusScript.setAttribute("data-strict", "0");
      giscusScript.setAttribute("data-reactions-enabled", "1");
      giscusScript.setAttribute("data-emit-metadata", "0");
      giscusScript.setAttribute("data-input-position", "bottom");
      giscusScript.setAttribute("data-theme", "transparent_dark");
      giscusScript.setAttribute("data-lang", "zh-CN");
      giscusScript.setAttribute("crossorigin", "anonymous");
      giscusScript.async = true;
      
      document.getElementById("giscus-mount").appendChild(giscusScript);

      // 4. 定义一个强力的主题同步函数
      const syncThemeToGiscus = () => {
        const isDark = document.documentElement.getAttribute("data-theme") === "dark";
        const theme = isDark ? "transparent_dark" : "light";
        
        const iframe = document.querySelector('iframe.giscus-frame');
        if (iframe) {
          iframe.contentWindow.postMessage(
            { giscus: { setConfig: { theme: theme } } },
            'https://giscus.app'
          );
        }
      };

      // 5. 延迟强推一次主题
      setTimeout(syncThemeToGiscus, 1000);

      // 6. 监听博客的主题切换
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.attributeName === "data-theme") {
            syncThemeToGiscus();
          }
        });
      });
      observer.observe(document.documentElement, { attributes: true });
    });
  </script>
</body>
</html>
