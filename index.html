<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页 · 我的博客</title>
  <link rel="stylesheet" href="libs/bulma.min.css" />
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="custom.css" />
  <link rel="stylesheet" href="custom-themes.css" />
  <script>
    (function() {
      var mode = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var palette = localStorage.getItem('palette') || 'default';
      if (palette !== 'default') document.documentElement.setAttribute('data-palette', palette);
    })();
  </script>
</head>
<body>
  <div id="site-navbar"></div>

  <!-- 顶部 Hero 横幅（带动态天空） -->
  <section class="hero is-light hero-sky" style="margin-top: 3.25rem;">
    <div id="sky-celestial"></div>
    <div id="sky-stars"></div>
    
    <div class="time-control">
      <div class="time-info">
        <span id="time-display" class="time-text">12:00:00</span>
        <span class="time-divider">·</span>
        <span id="date-display" class="date-text">1月1日 周一</span>
      </div>
      <button id="time-btn" class="time-btn" title="切换时段效果">
        <span id="time-icon">☀️ 白天</span>
      </button>
    </div>

    <div class="hero-body py-5" style="position: relative; z-index: 2;">
      <div class="container">
        <h1 id="hero-title" class="title is-2 mb-3" style="color: inherit;"></h1>
        <p id="hero-subtitle" class="subtitle is-5" style="color: inherit; opacity: 0.8;"></p>
      </div>
    </div>
  </section>

  <section class="section pt-5" style="position: relative;">
    <!-- 底部装饰线 -->
    <div class="hero-bottom-decoration">
      <span class="deco-diamond"></span>
      <span class="deco-line"></span>
      <span class="deco-diamond"></span>
    </div>

    <div class="container">
      <div class="columns is-variable is-8">
        <!-- 左侧：主内容区 -->
        <div class="column is-8">
          <div class="is-flex is-align-items-center is-justify-content-space-between is-flex-wrap-wrap mb-4" style="gap:.75rem;">
            <h2 class="title is-4 mb-0">最新文章</h2>
            <div id="sort-control" class="is-flex is-align-items-center"></div>
          </div>
          <div id="tag-filter" class="tags mb-5"></div>
          <div id="post-list"></div>
          <div id="post-status"></div>
        </div>

        <!-- 右侧：侧边栏 -->
        <div class="column is-4">
          <div id="sidebar-profile" class="mb-5"></div>

          <div class="box mb-5" style="border-radius: var(--bulma-radius-large);">
            <h3 class="title is-5 mb-3"><i class="fas fa-code-branch has-text-primary mr-2"></i>开源项目</h3>
            <ul id="sidebar-projects" class="menu-list"></ul>
            <div class="has-text-right mt-3">
              <a href="projects.html" class="is-size-7 has-text-link">查看全部 →</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/fallback-data.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/home.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/sky.js" defer></script>
  <script src="js/theme.js" defer></script>
</body>
</html>
