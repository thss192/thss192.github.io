<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>首页 · 我的博客</title>
  <link rel="stylesheet" href="libs/bulma.min.css" />
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/custom.css" />
  <link rel="stylesheet" href="css/custom-themes.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/posts.css" />
  <script>
    (function() {
      var mode = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var palette = localStorage.getItem('palette') || 'default';
      if (palette !== 'default') document.documentElement.setAttribute('data-palette', palette);
    })();
  </script>
</head>
<body>
  <div id="site-navbar"></div>

  <section class="hero is-light hero-sky" style="margin-top: 3.25rem;">
    <div id="sky-celestial"></div>
    <div id="sky-moon"></div>
    <div id="sky-stars"></div>
    
    <div class="time-control">
      <div class="time-info">
        <span id="time-display" class="time-text">12:00:00</span>
        <span class="time-divider">·</span>
        <span id="date-display" class="date-text">1月1日 周一</span>
      </div>
      <button id="time-btn" class="time-btn" title="切换时段效果">
        <span id="time-icon">☀️ 白天</span>
      </button>
    </div>

    <div class="hero-body py-5" style="position: relative; z-index: 2;">
      <div class="container">
        <h1 id="hero-title" class="title is-2 mb-3" style="color: inherit;"></h1>
        <p id="hero-subtitle" class="subtitle is-5" style="color: inherit; opacity: 0.8;"></p>
      </div>
    </div>
  </section>

  <section class="section pt-5" style="position: relative;">
    <div class="container" style="max-width: 1400px;">
      
      <div class="home-split-layout">
        
        <!-- 左侧：合并了标签云和最新文章的大卡片 -->
        <div class="home-main-content">
          <div class="box mb-5 content-card">
            
            <!-- 标签云部分 -->
            <div class="tag-cloud-inline mb-5">
              <div class="is-flex is-align-items-center mb-3">
                <h3 class="title is-6 mb-0"><i class="fas fa-cloud has-text-primary mr-2"></i>标签云</h3>
              </div>
              <div id="tag-cloud-container" class="tag-cloud-wrapper"></div>
            </div>

            <!-- 最新文章部分 -->
            <div class="is-flex is-align-items-center mb-4">
              <h3 class="title is-5 mb-0"><i class="fas fa-feather-alt has-text-primary mr-2"></i>最近写了什么</h3>
            </div>
            <div id="latest-posts" class="home-latest-list"></div>
            
            <div class="has-text-centered mt-6">
              <a href="posts" class="button is-rounded is-light px-5">
                查看全部文章 <i class="fas fa-arrow-right ml-2" style="font-size:0.8em;"></i>
              </a>
            </div>
            <div id="post-status"></div>
          </div>
        </div>

        <!-- 右侧：分成三个独立卡片的布局 -->
        <div class="home-sidebar-content">
          
          <!-- 独立卡片 1：个人信息 -->
          <div class="box sidebar-card">
            <div id="sidebar-profile-top"></div>
          </div>

          <!-- 独立卡片 2：开源项目 -->
          <div class="box sidebar-card">
            <div id="sidebar-projects"></div>
          </div>
          
          <!-- 独立卡片 3：探索博客 + 数据看板 -->
          <div class="box sidebar-card">
            <h3 class="sidebar-card-title"><i class="fas fa-compass has-text-primary mr-2"></i>探索博客</h3>
            <div class="home-nav-links">
              <a href="posts?view=series" class="home-nav-link">
                <div class="nav-icon"><i class="fas fa-layer-group"></i></div>
                <div class="nav-text">
                  <span class="nav-title">分类目录</span>
                  <span class="nav-desc">按系列浏览</span>
                </div>
              </a>
              <a href="posts?view=time" class="home-nav-link">
                <div class="nav-icon"><i class="fas fa-clock"></i></div>
                <div class="nav-text">
                  <span class="nav-title">时间归档</span>
                  <span class="nav-desc">顺着时间线回顾</span>
                </div>
              </a>
            </div>
            
            <!-- 把数据看板放在这里 -->
            <div id="sidebar-stats"></div>
          </div>

        </div>

      </div>

    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/fallback-data.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/home.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/sky.js" defer></script>
  <script src="js/theme.js" defer></script>
  <script src="js/cursor.js" defer></script>
</body>
</html>
