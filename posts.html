<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文章 · 我的博客</title>
  <link rel="stylesheet" href="libs/bulma.min.css" />
  <link rel="stylesheet" href="libs/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="css/custom.css" />
  <link rel="stylesheet" href="css/custom-themes.css" />
  <link rel="stylesheet" href="css/posts.css" />
  <link rel="stylesheet" href="css/sky.css" />
  <script>
    (function() {
      var mode = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      if (mode === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      var palette = localStorage.getItem('palette') || 'default';
      if (palette !== 'default') document.documentElement.setAttribute('data-palette', palette);
    })();
  </script>
</head>
<body>
  <div id="site-navbar"></div>

  <section class="hero is-light hero-sky" style="margin-top: 3.25rem;">
    <div id="sky-celestial"></div>
    <div id="sky-moon"></div>
    <div id="sky-stars"></div>
    
    <div class="time-control">
      <div class="time-info">
        <span id="time-display" class="time-text">12:00:00</span>
        <span class="time-divider">·</span>
        <span id="date-display" class="date-text">1月1日 周一</span>
      </div>
      <button id="time-btn" class="time-btn" title="切换时段效果">
        <span id="time-icon">☀️ 白天</span>
      </button>
    </div>

    <div class="hero-body py-5" style="position: relative; z-index: 2;">
      <div class="container">
        <h1 id="page-title" class="title is-2 mb-3" style="color: inherit;">
          <span class="icon has-text-primary mr-2" style="color: inherit;"><i class="fas fa-book-open"></i></span>
          <span id="posts-title-text">全部文章</span>
        </h1>
        <p id="page-subtitle" class="subtitle is-5" style="color: inherit; opacity: 0.8;"></p>
      </div>
    </div>
  </section>

  <section class="section pt-5" style="position: relative;">
    <div class="container">
      
      <div class="posts-tabs mb-4">
        <a href="?view=series" class="posts-tab" id="tab-series">
          <span class="icon is-small mr-1"><i class="fas fa-layer-group"></i></span> 按系列分类
        </a>
        <a href="?view=time" class="posts-tab" id="tab-time">
          <span class="icon is-small mr-1"><i class="fas fa-clock"></i></span> 按时间归档
        </a>
      </div>

      <!-- 工作区 -->
      <div class="posts-workspace" id="posts-workspace">
        
        <!-- 左侧目录 -->
        <aside class="posts-sidebar" id="posts-sidebar">
          <div class="sidebar-header">
            <span class="sidebar-title"><i class="fas fa-list-ul mr-2"></i>目录</span>
            <button class="button is-small is-ghost" id="sidebar-toggle" title="收起目录">
              <span class="icon"><i class="fas fa-chevron-left"></i></span>
            </button>
          </div>
          <div class="sidebar-content" id="posts-sidebar-inner">
            <!-- 由 JS 渲染 -->
          </div>
        </aside>

        <!-- 右侧文章区 -->
        <main class="posts-main" id="posts-main">
          <button class="button is-rounded is-light sidebar-expand-btn" id="sidebar-expand">
            <span class="icon is-small"><i class="fas fa-bars"></i></span>
            <span>展开目录</span>
          </button>
          
          <div id="posts-content-area"></div>
          <div id="posts-status"></div>
        </main>

      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="js/fallback-data.js"></script>
  <script src="js/common.js" defer></script>
  <script src="js/cursor.js" defer></script>
  <script src="js/posts.js" defer></script>
  <script src="js/effects.js" defer></script>
  <script src="js/sky.js" defer></script>
  <script src="js/theme.js" defer></script>
</body>
</html>
